name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set CI environment variables
        shell: bash
        run: |
          REPO="nspohrer/pybarsys"
          CLEANED_BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9]/_/g')

          if [[ "${GITHUB_REF_NAME}" == "master" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG_BRANCH="latest"
          else
            TAG_BRANCH="${CLEANED_BRANCH_NAME}"
          fi

          TAG_BRANCH_COMMIT="${CLEANED_BRANCH_NAME}-${GITHUB_SHA::6}"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            TAG_BRANCH="${TAG_BRANCH}-pr-${PR_NUMBER}"
            TAG_BRANCH_COMMIT="${TAG_BRANCH_COMMIT}-pr-${PR_NUMBER}"
          fi

          echo "REPO=${REPO}" >> $GITHUB_ENV
          echo "TAG_BRANCH=${TAG_BRANCH}" >> $GITHUB_ENV
          echo "TAG_BRANCH_COMMIT=${TAG_BRANCH_COMMIT}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip3 install -r requirements.txt -r requirements-dev.txt
          cp .env.example .env
          touch db.sqlite3
          chmod 666 db.sqlite3

      - name: Lint and format check
        run: |
          ruff format --check . || (echo "Run 'ruff format .' to fix formatting" && exit 1)
          ruff check . || (echo "Run 'ruff check --fix .' to fix lint violations" && exit 1)

      - name: Run unit tests
        run: python3 manage.py test

      - name: Check for missing migrations
        run: python3 manage.py makemigrations --check --dry-run

      - name: Smoke test run_test_server.sh
        run: |
          scripts/run_test_server.sh > "$RUNNER_TEMP/test_server.log" 2>&1 &
          scripts/try_for_60s.sh bash -c 'curl -sSf localhost:8000 | grep "There are no active users"' \
            || (cat "$RUNNER_TEMP/test_server.log"; exit 1)
          curl -sSf localhost:8000/static/barsys/style.css | grep media
          # prepare_pybarsys.sh has no set -e, so check admin creation explicitly
          python3 manage.py shell -c "from barsys.models import User; assert User.objects.filter(email='admin@example.com').exists()"
          pkill -f "[m]anage.py runserver" || true  # [m]: don't match own command line
          # Fresh DB so the Docker smoke test below also runs migrate + admin creation itself
          rm db.sqlite3 && touch db.sqlite3 && chmod 666 db.sqlite3

      - name: Build Docker images
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml build

      - name: Start application
        run: docker compose up -d

      - name: Smoke test application
        run: |
          scripts/try_for_60s.sh bash -c 'curl -sSL localhost | grep "There are no active users"'
          curl -sSL localhost/static/barsys/style.css | grep media

      - name: Test installer script (download from GitHub at this commit)
        run: |
          docker compose down  # free port 80 from the previous smoke test
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/"
          mkdir "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          echo y | PYBARSYS_BASE_URL="$BASE" bash -c "$(curl -sSfL "${BASE}scripts/download_pybarsys_docker.sh" -o-)"
          # Container user (uid 1000) can't write a 644 file owned by runner (uid 1001).
          # Same workaround as above; real fix tracked separately.
          chmod 666 db.sqlite3
          docker compose up -d
          "$GITHUB_WORKSPACE/scripts/try_for_60s.sh" bash -c 'curl -sSL localhost | grep "There are no active users"'

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        if: github.event_name == 'push'
        run: |
          docker build -t ${REPO}:${TAG_BRANCH} -t ${REPO}:${TAG_BRANCH_COMMIT} .
          docker push ${REPO}:${TAG_BRANCH}
          docker push ${REPO}:${TAG_BRANCH_COMMIT}

